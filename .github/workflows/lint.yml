name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Linting is cheap and stateless — superseded runs on the same ref are pure
# waste, so cancel them (unlike the multi-arch image build, which is not).
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hadolint:
    name: Hadolint (Dockerfile)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run hadolint (Debian)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

      - name: Run hadolint (Alpine)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile.alpine

      # Both variants must build the same upstream commit. check-upstream.yml
      # moves the pins together; this catches a hand edit of only one.
      - name: Check that both Dockerfiles pin the same upstream commit
        run: |
          debian=$(sed -nE 's/^ARG PCLOUDCC_REF=([0-9a-f]{40})$/\1/p' Dockerfile)
          alpine=$(sed -nE 's/^ARG PCLOUDCC_REF=([0-9a-f]{40})$/\1/p' Dockerfile.alpine)
          if [ -z "${debian}" ] || [ "${debian}" != "${alpine}" ]; then
            echo "ERROR: PCLOUDCC_REF differs: Dockerfile=${debian:-none}, Dockerfile.alpine=${alpine:-none}" >&2
            exit 1
          fi
          echo "Both pin ${debian}"

  actionlint:
    name: Actionlint (workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  shellcheck:
    name: Shellcheck (shell scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        env:
          # entrypoint.sh targets POSIX sh (#!/bin/sh), so use the strictest shell.
          SHELLCHECK_OPTS: --shell=sh --severity=warning

  tests:
    name: Shell tests (entrypoint, healthcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # dash is /bin/sh in the Debian image, so run the tests with it.
      - name: Run tests (dash, Debian image shell)
        run: dash tests/run.sh

      # BusyBox ash is /bin/sh in the Alpine image, and BusyBox also supplies
      # find, ls, sed and mountpoint there. Run in the pinned base image so the
      # tests see exactly those applets.
      - name: Run tests (BusyBox ash, Alpine image shell)
        run: |
          image=$(sed -nE 's/^FROM (alpine:[^ ]+) AS builder$/\1/p' Dockerfile.alpine)
          test -n "${image}"
          docker run --rm -v "${PWD}:/src:ro" -w /src "${image}" sh tests/run.sh
