name: Build and publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  schedule:
    # Weekly rebuild for Debian security updates (upstream changes detected by check-upstream.yml)
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      pcloudcc_ref:
        description: 'lneely/pcloudcc-lneely ref to build (branch, tag, or commit SHA)'
        required: false
        default: 'main'
        type: string

concurrency:
  # Serialize builds per ref so scheduled/upstream-triggered runs don't race with
  # push-triggered ones. We don't cancel in-progress builds: multi-arch builds are
  # expensive and we'd rather wait than throw work away.
  group: docker-build-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    # Generous ceiling for the QEMU-emulated arm builds; still far below the
    # 6h GitHub default so a hung build can't block the runner all day.
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
      id-token: write          # cosign keyless signing via GitHub OIDC
      security-events: write   # upload Trivy SARIF results to the Security tab

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v3
        with:
          platforms: linux/amd64,linux/arm64,linux/arm/v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Docker Hub configuration
        id: dockerhub_check
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_IMAGE_NAME_OVERRIDE: ${{ vars.DOCKERHUB_IMAGE_NAME }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "image=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$DOCKERHUB_IMAGE_NAME_OVERRIDE" ]; then
            image="$DOCKERHUB_IMAGE_NAME_OVERRIDE"
          else
            image="${DOCKERHUB_USERNAME}/${GITHUB_REPO_NAME}"
          fi

          # Docker Hub repository names must be lowercase.
          image="$(printf '%s' "$image" | tr '[:upper:]' '[:lower:]')"

          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && steps.dockerhub_check.outputs.enabled == 'true'
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          # metadata-action automatically emits OCI labels, including
          # org.opencontainers.image.revision = ${{ github.sha }}, so the git SHA
          # is baked into every published image via the labels: input below.
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ steps.dockerhub_check.outputs.enabled == 'true' && format('docker.io/{0}', steps.dockerhub_check.outputs.image) || '' }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=schedule,pattern=nightly
            type=raw,value={{date 'YYYY-MM-DD'}},enable=${{ github.event_name != 'pull_request' }}

      # Build linux/amd64 locally so Trivy can gate on it before anything is
      # published. Multi-platform builds can't be loaded into the local daemon,
      # so we build amd64-only here and export to a tar archive.
      - name: Build linux/amd64 for vulnerability scan
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          outputs: type=docker,dest=/tmp/scan-image.tar
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PCLOUDCC_REF=${{ inputs.pcloudcc_ref || 'main' }}
          # Scheduled runs exist solely to pick up Debian security updates, but
          # every layer — including `apt-get install` — is a cache hit as long as
          # the registry cache is attached and the base image digest is unchanged.
          # That made the "weekly security rebuild" republish a byte-identical
          # image: 8 of the last 10 scheduled runs finished in 2 minutes, i.e.
          # without building anything. Bypass the cache on schedule so apt
          # actually re-resolves against the current archive.
          no-cache: ${{ github.event_name == 'schedule' }}
          # Read from the shared cache; don't write — the full multi-platform
          # build below will update it.
          cache-from: ${{ github.event_name != 'schedule' && format('type=registry,ref={0}/{1}:buildcache', env.REGISTRY, env.IMAGE_NAME) || '' }}

      # Report: full SARIF for the Security tab — every severity, including
      # findings without an available fix. Non-blocking; the gate below decides
      # whether the build may proceed.
      - name: Run Trivy scan (full report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: /tmp/scan-image.tar
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: false
          exit-code: '0'

      # Gate: fail the build before any push if CRITICAL or HIGH CVEs with an
      # available fix are found. Runs on every event including pull_requests so
      # PRs are also blocked. Table output so a failing gate is readable in the
      # job log; the SARIF above is what reaches the Security tab.
      - name: Run Trivy vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: /tmp/scan-image.tar
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      # Gate: functional smoke test against the locally built amd64 image,
      # BEFORE anything is pushed — a broken binary must never reach the
      # registry as `latest`. Also runs on PRs (no registry access needed).
      - name: Smoke test image (linux/amd64)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          docker load -i /tmp/scan-image.tar
          IMAGE="$(printf '%s\n' "$TAGS" | head -n1)"
          docker run --rm --entrypoint /bin/sh "$IMAGE" -c '
            set -e
            test -x /usr/local/bin/pcloudcc
            test -x /entrypoint.sh
            test -x /usr/bin/bindfs
            echo "--- upstream commit baked into this image ---"
            cat /usr/local/share/pcloudcc/upstream-commit
            echo "--- ldd /usr/local/bin/pcloudcc ---"
            ldd /usr/local/bin/pcloudcc
            if ldd /usr/local/bin/pcloudcc 2>&1 | grep -q "not found"; then
              echo "ERROR: pcloudcc has unresolved shared libraries"
              exit 1
            fi
            echo "Smoke test OK"
          '

      # Full multi-platform build and push. Runs only after the Trivy and
      # smoke-test gates pass and only on non-PR events.
      - name: Build and push (all platforms)
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # PCLOUDCC_REF defaults to 'main' for push/schedule/PR triggers and can be
          # overridden on manual runs via the workflow_dispatch input (or by
          # check-upstream.yml when a new upstream tag is detected).
          build-args: |
            PCLOUDCC_REF=${{ inputs.pcloudcc_ref || 'main' }}
          provenance: mode=max
          sbom: true
          # BuildKit reuses layers from the scan build above (same daemon), so
          # this is effectively just the push for amd64, not a full rebuild.
          # On scheduled runs the registry cache is skipped for the same reason
          # as above; the freshly built amd64 layers still come from the local
          # BuildKit cache, only arm64/arm-v7 are rebuilt from scratch.
          cache-from: ${{ github.event_name != 'schedule' && format('type=registry,ref={0}/{1}:buildcache', env.REGISTRY, env.IMAGE_NAME) || '' }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign published images
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # Keyless sign every tag reference against the pushed manifest digest.
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "Signing ${tag}@${DIGEST}"
            cosign sign --yes "${tag}@${DIGEST}"
          done <<< "$TAGS"

      - name: Upload Trivy scan results to GitHub Security tab
        if: always() && github.event_name != 'pull_request' && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Update Docker Hub description
        # The description sync hits Docker Hub's /v2/repositories/<ns>/<repo>/
        # PATCH endpoint, which requires a higher token scope than plain image
        # pushes. A PAT with "Read & Write" is enough to push layers but will
        # return 403 Forbidden here. To actually update the description you
        # need either:
        #   - a Docker Hub PAT with the "Read, Write & Delete" scope, OR
        #   - an Organization Access Token with repo-admin rights, OR
        #   - the account password (not recommended).
        # Either way we don't want a cosmetic sync to fail the entire build,
        # so this step is best-effort.
        if: >-
          github.event_name == 'push'
          && github.ref == 'refs/heads/main'
          && steps.dockerhub_check.outputs.enabled == 'true'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ steps.dockerhub_check.outputs.image }}
          short-description: ${{ github.event.repository.description }}
          readme-filepath: ./README.md
