name: Build and publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  schedule:
    # Weekly rebuild for Debian security updates (upstream changes detected by check-upstream.yml)
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      pcloudcc_ref:
        description: 'lneely/pcloudcc-lneely ref to build (branch, tag, or commit SHA)'
        required: false
        default: 'main'
        type: string

concurrency:
  # Serialize builds per ref so scheduled/upstream-triggered runs don't race with
  # push-triggered ones. We don't cancel in-progress builds: multi-arch builds are
  # expensive and we'd rather wait than throw work away.
  group: docker-build-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    # Generous ceiling for the QEMU-emulated arm builds; still far below the
    # 6h GitHub default so a hung build can't block the runner all day.
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
      id-token: write          # cosign keyless signing via GitHub OIDC
      security-events: write   # upload Trivy SARIF results to the Security tab

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only the multi-platform push build below needs emulation, and that step
      # is skipped on pull requests — the scan build is amd64-only and runs
      # natively. Registering binfmt handlers must still happen before buildx
      # boots its builder, so this stays ahead of setup-buildx-action.
      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v3
        with:
          platforms: linux/amd64,linux/arm64,linux/arm/v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Docker Hub configuration
        id: dockerhub_check
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_IMAGE_NAME_OVERRIDE: ${{ vars.DOCKERHUB_IMAGE_NAME }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "image=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$DOCKERHUB_IMAGE_NAME_OVERRIDE" ]; then
            image="$DOCKERHUB_IMAGE_NAME_OVERRIDE"
          else
            image="${DOCKERHUB_USERNAME}/${GITHUB_REPO_NAME}"
          fi

          # Docker Hub repository names must be lowercase.
          image="$(printf '%s' "$image" | tr '[:upper:]' '[:lower:]')"

          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && steps.dockerhub_check.outputs.enabled == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Everything published from a ref other than the default branch (or a
      # v* tag) is a development image. Two things have to follow from that:
      # it must never take a tag a release build could also take, and it has
      # to say so in its own metadata — up to now the only hint was
      # org.opencontainers.image.version happening to hold a branch name.
      - name: Classify build channel
        id: channel
        env:
          REF: ${{ github.ref }}
          # Absent from some event payloads, so fall back rather than
          # misclassifying a scheduled release build as a dev build.
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          default_branch="${DEFAULT_BRANCH:-main}"
          case "${REF}" in
            "refs/heads/${default_branch}"|refs/tags/v*) channel=release ;;
            *)                                          channel=dev ;;
          esac
          echo "name=${channel}" >> "$GITHUB_OUTPUT"
          echo "release=$([ "${channel}" = release ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Build channel: ${channel} (ref=${REF}, default branch=${default_branch})"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          # metadata-action automatically emits OCI labels, including
          # org.opencontainers.image.revision = ${{ github.sha }}, so the git SHA
          # is baked into every published image via the labels: input below.
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ steps.dockerhub_check.outputs.enabled == 'true' && format('docker.io/{0}', steps.dockerhub_check.outputs.image) || '' }}
          # Release and dev tags are kept in disjoint namespaces. Dev builds
          # get a `dev-` prefix on the branch tag, an immutable `dev-<sha>`,
          # and crucially NOT the dated tag: that one is unprefixed and shared,
          # so a branch build used to quietly overwrite the dated tag that a
          # main build had published the same day.
          tags: |
            type=ref,event=branch,enable=${{ steps.channel.outputs.release == 'true' }}
            type=ref,event=branch,prefix=dev-,enable=${{ steps.channel.outputs.release != 'true' }}
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=schedule,pattern=nightly
            type=raw,value={{date 'YYYY-MM-DD'}},enable=${{ github.event_name != 'pull_request' && steps.channel.outputs.release == 'true' }}
            type=sha,prefix=dev-,enable=${{ github.event_name != 'pull_request' && steps.channel.outputs.release != 'true' }}
          # Makes the channel readable from the image itself (docker inspect),
          # not just inferable from the tag someone happened to pull it by.
          labels: |
            org.opencontainers.image.ref.name=${{ github.ref_name }}
            pcloudcc.build.channel=${{ steps.channel.outputs.name }}

      # Build linux/amd64 locally so Trivy can gate on it before anything is
      # published. Multi-platform builds can't be loaded into the local daemon,
      # so we build amd64-only here and export to a tar archive.
      - name: Build linux/amd64 for vulnerability scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          outputs: type=docker,dest=/tmp/scan-image.tar
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PCLOUDCC_REF=${{ inputs.pcloudcc_ref || 'main' }}
          # Scheduled runs exist solely to pick up Debian security updates, but
          # every layer — including `apt-get install` — is a cache hit as long as
          # the registry cache is attached and the base image digest is unchanged.
          # That made the "weekly security rebuild" republish a byte-identical
          # image: 8 of the last 10 scheduled runs finished in 2 minutes, i.e.
          # without building anything. Bypass the cache on schedule so apt
          # actually re-resolves against the current archive.
          no-cache: ${{ github.event_name == 'schedule' }}
          # Read from the shared cache; don't write — the full multi-platform
          # build below will update it.
          cache-from: ${{ github.event_name != 'schedule' && format('type=registry,ref={0}/{1}:buildcache', env.REGISTRY, env.IMAGE_NAME) || '' }}

      # Report: full SARIF for the Security tab — every severity, including
      # findings without an available fix. Non-blocking; the gate below decides
      # whether the build may proceed.
      - name: Run Trivy scan (full report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: /tmp/scan-image.tar
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: false
          exit-code: '0'

      # Gate: fail the build before any push if CRITICAL or HIGH CVEs with an
      # available fix are found. Runs on every event including pull_requests so
      # PRs are also blocked. Table output so a failing gate is readable in the
      # job log; the SARIF above is what reaches the Security tab.
      - name: Run Trivy vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: /tmp/scan-image.tar
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      # Gate: functional smoke test against the locally built amd64 image,
      # BEFORE anything is pushed — a broken binary must never reach the
      # registry as `latest`. Also runs on PRs (no registry access needed).
      - name: Smoke test image (linux/amd64)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          docker load -i /tmp/scan-image.tar
          IMAGE="$(printf '%s\n' "$TAGS" | head -n1)"
          docker run --rm --entrypoint /bin/sh "$IMAGE" -c '
            set -e
            test -x /usr/local/bin/pcloudcc
            test -x /entrypoint.sh
            test -x /healthcheck.sh
            # Both scripts run under /bin/sh in this image; a syntax error would
            # otherwise only surface at container start.
            sh -n /entrypoint.sh
            sh -n /healthcheck.sh
            # entrypoint.sh needs a fusermount binary to tear FUSE mounts down
            # on shutdown. The Debian fuse3 package currently provides both
            # fusermount3 and the fuse 2.x compat name; assert at least one
            # survives a base image change, rather than finding out about it
            # from stale mounts left on a users host.
            command -v fusermount3 || command -v fusermount || {
              echo "ERROR: no fusermount binary in the runtime image"; exit 1; }
            # mountpoint comes from util-linux, which is Essential in Debian and
            # therefore no longer installed explicitly. Assert it is really there
            # so a de-essentialization in a future base image fails here rather
            # than at container start.
            command -v mountpoint
            command -v oathtool
            # bindfs was removed; entrypoint.sh must not start depending on it
            # again by accident.
            if [ -e /usr/bin/bindfs ]; then
              echo "ERROR: bindfs is back in the runtime image"; exit 1; fi
            # ca-certificates (and with it openssl/libssl3) was dropped in favour
            # of copying just the generated bundle out of the builder stage.
            test -s /etc/ssl/certs/ca-certificates.crt
            if command -v openssl >/dev/null 2>&1; then
              echo "ERROR: openssl is back in the runtime image"; exit 1; fi
            # No data.db in a fresh container: the healthcheck must report the
            # bootstrap state as healthy so Docker does not kill the container
            # before first-time login can finish.
            /healthcheck.sh
            echo "--- upstream commit baked into this image ---"
            cat /usr/local/share/pcloudcc/upstream-commit
            echo "--- ldd /usr/local/bin/pcloudcc ---"
            ldd /usr/local/bin/pcloudcc
            if ldd /usr/local/bin/pcloudcc 2>&1 | grep -q "not found"; then
              echo "ERROR: pcloudcc has unresolved shared libraries"
              exit 1
            fi
            # Upstream dropped Boost.Program_options for the vendored CLI11.hpp
            # (lneely#396), so the Dockerfile no longer installs any boost
            # package. If upstream ever links boost again the build would still
            # succeed and only fail at container start with a missing library,
            # so assert the binary really does not want one.
            if ldd /usr/local/bin/pcloudcc 2>&1 | grep -q "libboost"; then
              echo "ERROR: pcloudcc links against boost, but the runtime image no longer ships it"
              exit 1
            fi
            echo "Smoke test OK"
          '

      # Full multi-platform build and push. Runs only after the Trivy and
      # smoke-test gates pass and only on non-PR events.
      - name: Build and push (all platforms)
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # PCLOUDCC_REF defaults to 'main' for push/schedule/PR triggers and can be
          # overridden on manual runs via the workflow_dispatch input (or by
          # check-upstream.yml when a new upstream tag is detected).
          build-args: |
            PCLOUDCC_REF=${{ inputs.pcloudcc_ref || 'main' }}
          provenance: mode=max
          sbom: true
          # BuildKit reuses layers from the scan build above (same daemon), so
          # this is effectively just the push for amd64, not a full rebuild.
          # On scheduled runs the registry cache is skipped for the same reason
          # as above; the freshly built amd64 layers still come from the local
          # BuildKit cache, only arm64/arm-v7 are rebuilt from scratch.
          cache-from: ${{ github.event_name != 'schedule' && format('type=registry,ref={0}/{1}:buildcache', env.REGISTRY, env.IMAGE_NAME) || '' }}
          # Only release builds write the shared cache. A dev build still reads
          # it for a warm start, but must not write to it: the cache is keyed on
          # layer content, so a branch that changes the Dockerfile would have
          # pushed its layers into the cache that main builds restore from.
          cache-to: ${{ steps.channel.outputs.release == 'true' && format('type=registry,ref={0}/{1}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true', env.REGISTRY, env.IMAGE_NAME) || '' }}

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign published images
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # Keyless sign every tag reference against the pushed manifest digest.
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "Signing ${tag}@${DIGEST}"
            cosign sign --yes "${tag}@${DIGEST}"
          done <<< "$TAGS"

      - name: Upload Trivy scan results to GitHub Security tab
        if: always() && github.event_name != 'pull_request' && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Update Docker Hub description
        # The description sync hits Docker Hub's /v2/repositories/<ns>/<repo>/
        # PATCH endpoint, which requires a higher token scope than plain image
        # pushes. A PAT with "Read & Write" is enough to push layers but will
        # return 403 Forbidden here. To actually update the description you
        # need either:
        #   - a Docker Hub PAT with the "Read, Write & Delete" scope, OR
        #   - an Organization Access Token with repo-admin rights, OR
        #   - the account password (not recommended).
        # Either way we don't want a cosmetic sync to fail the entire build,
        # so this step is best-effort.
        if: >-
          github.event_name == 'push'
          && github.ref == 'refs/heads/main'
          && steps.dockerhub_check.outputs.enabled == 'true'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ steps.dockerhub_check.outputs.image }}
          short-description: ${{ github.event.repository.description }}
          readme-filepath: ./README.md
