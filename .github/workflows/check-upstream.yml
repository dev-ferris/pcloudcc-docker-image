name: Check upstream for new commits

on:
  schedule:
    # Check every 6 hours for new commits/tags in lneely/pcloudcc-lneely
    - cron: '0 */6 * * *'
  workflow_dispatch:

# A manual run overlapping the 6-hourly one would resolve the same SHA twice and
# dispatch two identical builds. Serialize and drop the redundant older run.
concurrency:
  group: check-upstream
  cancel-in-progress: true

env:
  UPSTREAM_REPO: lneely/pcloudcc-lneely

jobs:
  check-upstream:
    name: Check upstream ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    strategy:
      # The two probes are independent: a missing tag must not hide a new
      # commit on main (and vice versa).
      fail-fast: false
      matrix:
        include:
          # Tip of the default branch. It always exists, so an empty result is
          # a hard failure rather than a "nothing to do".
          - label: main branch
            api: 'commits/main'
            jq: '.sha // empty'
            required: true
            cache_path: upstream-sha.txt
            cache_prefix: upstream-sha
          # /tags returns the most recently created tag first. A fork without
          # any tags is legitimate, so an empty result just ends the run.
          - label: tags
            api: 'tags?per_page=1'
            jq: '.[0].name // empty'
            required: false
            cache_path: upstream-tag.txt
            cache_prefix: upstream-tag

    steps:
      - name: Resolve upstream ref
        id: upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_PATH: ${{ matrix.api }}
          JQ_FILTER: ${{ matrix.jq }}
          REQUIRED: ${{ matrix.required }}
        run: |
          REF=$(curl -sf -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${UPSTREAM_REPO}/${API_PATH}" \
            | jq -r "${JQ_FILTER}")
          if [ -z "${REF}" ] || [ "${REF}" = "null" ]; then
            if [ "${REQUIRED}" = "true" ]; then
              echo "ERROR: could not resolve upstream ref from '${API_PATH}'" >&2
              exit 1
            fi
            echo "Nothing found at '${API_PATH}' — nothing to do."
            echo "ref=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "Upstream ${API_PATH} resolved to: ${REF}"

      - name: Check against cached ref
        if: steps.upstream.outputs.ref != ''
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.cache_path }}
          key: ${{ matrix.cache_prefix }}-${{ steps.upstream.outputs.ref }}

      - name: Trigger build on new upstream ref
        if: steps.upstream.outputs.ref != '' && steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_REF: ${{ steps.upstream.outputs.ref }}
          CACHE_PATH: ${{ matrix.cache_path }}
        run: |
          echo "New upstream ref detected: ${UPSTREAM_REF}"
          # Pass the resolved SHA/tag, not the branch name. PCLOUDCC_REF is a
          # Docker build arg, so it is part of the cache key of the layer that
          # fetches and compiles upstream. Triggering with the literal "main"
          # produced the same cache key as the previous build and the new
          # upstream code was never compiled — the build "succeeded" while
          # shipping the old binary. A SHA is unique per commit and therefore
          # both busts the cache and pins the build reproducibly.
          gh workflow run docker-build.yml \
            --repo "${GITHUB_REPOSITORY}" \
            -f pcloudcc_ref="${UPSTREAM_REF}"
          echo "Build workflow triggered for ref=${UPSTREAM_REF}."
          # Write the cache marker only once the dispatch actually succeeded,
          # so the file that records "this ref is handled" can never outlive a
          # failed `gh workflow run`. (actions/cache's post step is `post-if:
          # success()`, so today a failed dispatch already skips the save —
          # this just stops that from being load-bearing.)
          echo "${UPSTREAM_REF}" > "${CACHE_PATH}"
