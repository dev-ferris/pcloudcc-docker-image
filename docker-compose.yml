volumes:
  pconfig: {}

services:
  pcloud:
    build:
      context: .
      args:
        PCLOUDCC_REF: main
    restart: unless-stopped
    # tini as PID 1: reaps zombies and forwards signals to the entrypoint.
    init: true
    # entrypoint.sh grants pcloudcc up to 10s for a graceful shutdown plus
    # FUSE unmounts; Docker's default grace period is also 10s, which would
    # SIGKILL the container mid-teardown and leave stale mounts on the host.
    stop_grace_period: 30s
    volumes:
      - pconfig:/root/.pcloud:rw
      - /path/to/your/pcloud:/pcloud:rshared
    env_file:
      - .env
    environment:
      # PCLOUD_MOUNT is also the image default; it is spelled out because it
      # has to match the bind mount above, and the two should be edited
      # together. This replaces the old ENABLE_BINDFS=1, where pcloudcc mounted
      # at a private /pcloud_internal and a bindfs overlay re-exported it here
      # with the ownership rewritten. ENABLE_BINDFS=1 still works and is
      # translated into exactly these two lines, but prefer this form.
      #
      # allow_other is required for uid=/gid= to be of any use: the mount is
      # created by root, and the kernel would otherwise deny access to every
      # other uid. default_permissions must accompany it -- pcloudcc performs
      # no access checks of its own, so without it the kernel enforces nothing
      # and every local uid gets full read/write on the account. Drop the
      # PCLOUD_FUSE_OPTS line if only root needs to read the mount.
      - PCLOUD_MOUNT=/pcloud
      - PCLOUD_FUSE_OPTS=uid=1000,gid=1000,allow_other,default_permissions
    read_only: true
    tmpfs:
      - /tmp
      - /run
    security_opt:
      - apparmor:unconfined
      - no-new-privileges:true
    devices:
      - /dev/fuse
    # Drop all default capabilities and add back only what is actually needed.
    # SYS_ADMIN: required for FUSE mount/umount by pcloudcc.
    # CHOWN:     required by entrypoint.sh to chown the mount point to USER:GROUP.
    #            Note this now lands on the host directory bind-mounted above,
    #            while it is still empty and before pcloudcc mounts over it.
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - CHOWN
    # Required for first-time interactive login; can be removed after initial credential setup.
    stdin_open: true
    tty: true
    # pcloudcc logs continuously and this container is meant to run for months.
    # Without a cap the json-file log grows unbounded and fills the host disk.
    # Note this only caps Docker's capture of stdout/stderr. pcloudcc's own
    # debug.log and its file cache live in the `pconfig` volume and are bounded
    # by PCLOUD_LOG_LEVEL / PCLOUD_CACHE_SIZE instead — see README.md.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
